{% extends 'dashboard/admin_base.html' %}

{% block title %}Import Excel{% endblock %}

{% block admin_content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <h1 class="text-2xl font-heading font-bold text-secondary">Import Excel Data</h1>
        <p class="text-sm text-gray-500 mt-1">Bulk import data from Excel files</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Excel File</label>
                <input type="file" name="excel_file" accept=".xlsx,.xls" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                <p class="text-sm text-gray-500 mt-1">Supported sheets: Programs, Cohorts, Students, Courses, Enrollments, Payments</p>
            </div>
            <div class="flex items-center">
                <input type="checkbox" name="dry_run" id="dry_run" class="mr-2">
                <label for="dry_run" class="text-sm text-gray-700">Dry Run (preview without saving)</label>
            </div>
            <div class="flex items-center">
                <input type="checkbox" name="update_existing" id="update_existing" class="mr-2">
                <label for="update_existing" class="text-sm text-gray-700">Update existing records</label>
            </div>
            <div class="flex gap-4 pt-4">
                <button type="submit" class="flex-1 bg-primary hover:bg-primaryDark text-white font-semibold py-3 px-4 rounded-lg transition shadow-sm">
                    Import Data
                </button>
                <a href="{% url 'portal:admin_dashboard' %}" class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition font-medium">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
