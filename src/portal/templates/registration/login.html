{% extends 'base.html' %}

{% block title %}Login - COGRABIG INSTITUTE OF ARTS{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-lg shadow-lg p-8 border-t-4 border-primary">
            <h2 class="text-3xl font-heading font-bold text-secondary text-center mb-2">COGRABIG</h2>
            <p class="text-center text-gray-600 mb-8">Sign in to your account</p>
            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" name="username" id="id_username" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>
                <div>
                    <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" id="id_password" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>
                <button type="submit"
                    class="w-full bg-primary hover:bg-primaryHover text-white font-semibold py-3 px-4 rounded-md transition duration-200">
                    Sign In
                </button>
            </form>
            <p class="text-center text-sm text-gray-600 mt-4">
                <a href="{% url 'password_reset' %}" class="text-primary hover:text-primaryHover">Forgot password?</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
