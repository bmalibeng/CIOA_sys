{% extends 'base.html' %}

{% block title %}Import Excel - COGRABIG INSTITUTE OF ARTS{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-lg shadow p-8 border-t-4 border-primary">
        <h1 class="text-3xl font-heading font-bold text-secondary mb-6">Import Excel Data</h1>
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Excel File</label>
                <input type="file" name="excel_file" accept=".xlsx,.xls" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md">
                <p class="text-sm text-gray-500 mt-1">Supported sheets: Programs, Cohorts, Students, Courses, Enrollments, Payments</p>
            </div>
            <div class="flex items-center">
                <input type="checkbox" name="dry_run" id="dry_run" class="mr-2">
                <label for="dry_run" class="text-sm text-gray-700">Dry Run (preview without saving)</label>
            </div>
            <div class="flex items-center">
                <input type="checkbox" name="update_existing" id="update_existing" class="mr-2">
                <label for="update_existing" class="text-sm text-gray-700">Update existing records</label>
            </div>
            <button type="submit" class="w-full bg-primary hover:bg-primaryHover text-white font-semibold py-3 px-4 rounded-md transition">
                Import Data
            </button>
        </form>
    </div>
</div>
{% endblock %}
